# This is a reusable HYBRID workflow for the coolcow organization.
# It uses a three-job approach to build, test, and then publish an image.

on:
  workflow_call:
    inputs:
      image_name:
        description: 'The name of the image, which will be prefixed with "coolcow/".'
        required: true
        type: string
      dockerfile_path:
        description: 'The path to the main Dockerfile.'
        required: false
        type: string
        default: 'build/Dockerfile'
      build_context:
        description: 'The build context path for the Docker build.'
        required: false
        type: string
        default: '.'
      test_dockerfile_path:
        description: 'Optional path to a Dockerfile for testing the image.'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: coolcow/${{ inputs.image_name }}
  IMAGE_ARTEFACT_NAME: docker-image
  IMAGE_ARTEFACT_PATH: /tmp/${{ inputs.image_name }}.tar
  LOCAL_TEST_TAG: ${{ inputs.image_name }}:local-test-build

jobs:
  # Job 1: Build the image and save it as an artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          load: true
          push: false
          tags: ${{ env.LOCAL_TEST_TAG }}

      - name: Save image as a tarball
        run: docker save ${{ env.LOCAL_TEST_TAG }} --output ${{ env.IMAGE_ARTEFACT_PATH }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTEFACT_NAME }}
          path: ${{ env.IMAGE_ARTEFACT_PATH }}

  # Job 2: Run smoke tests on the built image artifact.
  test:
    needs: build
    # This job is optional and only runs if a test file is provided.
    if: inputs.test_dockerfile_path != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTEFACT_NAME }}
          path: /tmp

      - name: Load image from tarball
        run: docker load --input ${{ env.IMAGE_ARTEFACT_PATH }}

      - name: Run smoke tests
        run: |
          docker build \
            --build-arg APP_IMAGE=${{ env.LOCAL_TEST_TAG }} \
            -f ${{ inputs.test_dockerfile_path }} \
            ${{ inputs.build_context }}

  # Job 3: Publish the image if tests passed.
  publish:
    # This job depends on the test job, which gracefully handles being skipped.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,prefix=
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Sign the published Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
