# This is a reusable HYBRID workflow for the coolcow organization.
# It handles two scenarios:
# 1. CI builds: On pushes to `main`, it builds and pushes a development image.
# 2. Releases: On pushes of tags (v*.*.*), it builds, pushes, and signs a formal release image.
on:
  workflow_call:
    inputs:
      image_name:
        description: 'The name of the image, which will be prefixed with "coolcow/". Example: "autossh"'
        required: true
        type: string
      dockerfile_path:
        description: 'The path to the Dockerfile.'
        required: false
        type: string
        default: 'build/Dockerfile'
      build_context:
        description: 'The build context path for the Docker build.'
        required: false
        type: string
        default: '.'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: coolcow/${{ inputs.image_name }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request' # Do not log in on PRs, as we do not push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Create a tag for pushes to the main branch
            type=ref,event=branch,prefix=
            # Create semver tags for versioned releases
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Create 'latest' tag but only on formal releases (tags)
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          push: ${{ github.event_name != 'pull_request' }} # Only push when not a PR
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v') # Only sign on formal releases (tags)
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Sign the published Docker image
        if: startsWith(github.ref, 'refs/tags/v') # Only sign on formal releases (tags)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
