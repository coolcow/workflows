# This is a reusable HYBRID workflow for the coolcow organization.
# It uses a two-job approach to first test and then publish an image.

on:
  workflow_call:
    inputs:
      image_name:
        description: 'The name of the image, which will be prefixed with "coolcow/".'
        required: true
        type: string
      dockerfile_path:
        description: 'The path to the main Dockerfile.'
        required: false
        type: string
        default: 'build/Dockerfile'
      build_context:
        description: 'The build context path for the Docker build.'
        required: false
        type: string
        default: '.'
      test_dockerfile_path:
        description: 'Optional path to a Dockerfile for testing the image.'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: coolcow/${{ inputs.image_name }}

jobs:
  # This job runs on all triggers (PRs, push to main, tags)
  # It builds the image and runs tests, but does not push.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          load: true # Load image for the test step
          push: false
          tags: ${{ env.IMAGE_NAME }}:local-test-build

      - name: Run smoke tests
        if: inputs.test_dockerfile_path != ''
        run: |
          docker build \
            --build-arg APP_IMAGE=${{ env.IMAGE_NAME }}:local-test-build \
            -f ${{ inputs.test_dockerfile_path }} \
            ${{ inputs.build_context }}

  # This job only runs after build-and-test is successful,
  # and only for pushes to the main branch or version tags.
  publish:
    needs: build-and-test
    # This condition ensures we only publish on actual code changes, not on PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,prefix=
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Sign the published Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
